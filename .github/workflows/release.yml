name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ch-devkit-v1, ch-esp32s3, ch-tdisplay-s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware + filesystem
        run: |
          pio run -e ${{ matrix.target }}
          pio run -e ${{ matrix.target }} -t buildfs
      - name: Package
        run: |
          mkdir -p out
          cp .pio/build/${{ matrix.target }}/firmware.bin out/criptohost-nerdos-${{ github.ref_name }}-${{ matrix.target }}.bin
          cp .pio/build/${{ matrix.target }}/littlefs.bin out/criptohost-nerdos-${{ github.ref_name }}-${{ matrix.target }}-littlefs.bin
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin
          generate_release_notes: true
